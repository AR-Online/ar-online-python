[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aronline-sdk"
version = "0.1.0"
description = "SDK oficial da API do AR Online (/v3)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AR ONLINE TECNOLOGIA LTDA" }]
keywords = ["ar-online", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AR-Online/ar-online-python"
Repository = "https://github.com/AR-Online/ar-online-python"
Issues = "https://github.com/AR-Online/ar-online-python/issues"
Documentation = "https://docs.ar-online.com.br"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/aronline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src/ para o pacote, "." para o `from tests.support...` dos testes. Sem isto
# a suíte só roda depois de um `pip install -e .`, e um teste que exige
# instalação é um teste que ninguém roda antes de commitar.
pythonpath = ["src", "."]
addopts = "--cov=aronline --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["src/aronline"]

[tool.coverage.report]
# Módulo só de tipo não emite código: o TypedDict some em tempo de execução,
# e cobrar cobertura dele mede o interpretador, não o SDK.
omit = ["*/models/*", "*/__init__.py"]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]
