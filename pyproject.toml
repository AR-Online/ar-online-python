[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aronline-sdk"
version = "0.1.0"
description = "SDK oficial da API do AR Online (/v3)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AR ONLINE TECNOLOGIA LTDA" }]
keywords = ["ar-online", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Ar-Online/ar-online-python"
Repository = "https://github.com/Ar-Online/ar-online-python"
Issues = "https://github.com/Ar-Online/ar-online-python/issues"
Documentation = "https://docs.ar-online.com.br"

[dependency-groups]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/aronline"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
